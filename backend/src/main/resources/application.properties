spring.application.name=taskmanager

# MySQL connection; values come from environment variables (see .env.example).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# update: create/alter tables to match the entities, but keep existing data.
spring.jpa.hibernate.ddl-auto=update

# JWT signing key (HS256, at least 32 bytes) and token lifetime. No default for the secret.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
